name: Validate Data Agent Radar

on:
  push:
    branches: [main, research-radar-reading-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test time-first and registry contracts
        run: python -m unittest discover -s tests -v
      - name: Validate no public operational run artifacts
        run: python scripts/no_public_runs.py
      - name: Validate bilingual reading surfaces and registry
        run: python scripts/validate_reading.py
